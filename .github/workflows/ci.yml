
name: Smart Campus CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_lockfile:
        description: 'Commit compatible lockfile update to assignment-06-work'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

  prepare-lockfile:
    if: github.event_name == 'workflow_dispatch' && !inputs.apply_lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare compatible dependency lockfile
        run: npm update --package-lock-only --ignore-scripts --no-audit
      - name: Keep Vitest major version 2
        run: |
          node -e "const p=require('./package-lock.json').packages['node_modules/vitest']; if (!p || !p.version.startsWith('2.')) process.exit(1); console.log('Vitest:',p.version)"
      - name: Record lockfile changes
        run: git diff -- package-lock.json > lockfile.patch
      - name: Audit proposed dependency set
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency review artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile-review
          path: |
            package-lock.json
            lockfile.patch
            npm-audit.json
          retention-days: 7

  apply-lockfile:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_lockfile && github.ref == 'refs/heads/assignment-06-work'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout approved branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare compatible lockfile
        run: npm update --package-lock-only --ignore-scripts --no-audit
      - name: Ensure Vitest major stays at 2
        run: |
          node -e "const p=require('./package-lock.json').packages['node_modules/vitest']; if (!p || !p.version.startsWith('2.')) process.exit(1); console.log('Vitest:',p.version)"
      - name: Verify lockfile installs and project checks
        run: |
          npm ci
          npm test
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit only reviewed lockfile path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git commit -m "chore: refresh compatible dependency lockfile"
            git push origin HEAD:assignment-06-work
          fi

  trial-modern-toolchain:
    if: github.event_name == 'workflow_dispatch' && !inputs.apply_lockfile && github.ref == 'refs/heads/assignment-06-work'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare modern toolchain without committing
        run: npm install --save-dev vite@^8 vitest@^5 @vitejs/plugin-react@latest --package-lock-only --ignore-scripts --no-audit
      - name: Install proposed dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Run typecheck
        run: npm run typecheck
      - name: Run production build
        run: npm run build
      - name: Record dependency audit
        if: always()
        run: npm audit --json > modern-audit.json || true
      - name: Record changes
        if: always()
        run: git diff -- package.json package-lock.json > modern-toolchain.patch
      - name: Upload proposed toolchain for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-toolchain-trial
          path: |
            package.json
            package-lock.json
            modern-toolchain.patch
            modern-audit.json
          retention-days: 7
